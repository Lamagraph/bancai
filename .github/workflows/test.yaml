name: Tests

on:
    push:
    pull_request:
        branches: [main]

# A newer push to the same branch cancels the run still in progress.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check-formatting:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Setup Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.0

            - name: Check formatting
              run: zig fmt --check src && zig fmt --check tools && zig fmt --check build.zig

    test:
        runs-on: ubuntu-latest
        needs: check-formatting

        steps:
            - uses: actions/checkout@v6

            - name: Setup Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.0

            - name: Build
              run: zig build

            - name: Build and test
              run: zig build test

    test-thread-sanitizer:
        runs-on: ubuntu-latest
        needs: check-formatting

        steps:
            - uses: actions/checkout@v6

            - name: Setup Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.0

            - name: Golden tests (single and multithread) with ThreadSanitizer
              run: zig build golden-test -Dtsan=true
